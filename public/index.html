function saveInstall(){
  const editing = editingInstallId ? state.installs.find(j=>j.id===editingInstallId) : null;
  const items = installDraft.filter(l=>l.productId && l.qty>0).map(l=>{
    const p = state.products.find(x=>x.id===l.productId);
    return {productId:p.id, name:p.name, qty:l.qty, priceUsd:p.priceUsd};
  });
  // Validate against the current stock plus any qty already allocated to THIS install (refundable on save).
  for(const it of items){
    const p = state.products.find(x=>x.id===it.productId);
    const budget = stockBudgetFor(it.productId);
    if(it.qty > budget){ alert(`${t('notEnoughStock')}: ${p.name} (${budget})`); return;}
  }
  const date = document.getElementById('j-date').value || today();
  let carModel = document.getElementById('j-car')?.value || '';
  if(carModel === 'Other'){
    const typed = (document.getElementById('j-car-other')?.value || '').trim();
    if(!typed){ alert(t('carModelRequired')); return; }
    carModel = typed;                       // save the real name, not the word "Other"
  }
  // Stored upper-case and space-normalised, so "01a 123 bc" and "01A123BC" match when searched.
  const plate = (document.getElementById('j-plate')?.value || '').trim().toUpperCase().replace(/\s+/g,' ');
  const amountUsd = Number(document.getElementById('j-usd').value)||0;
  const amountSom = Number(document.getElementById('j-som').value)||0;
  const amountTransfer = Number(document.getElementById('j-trans')?.value)||0;
  const amountClick = Number(document.getElementById('j-click')?.value)||0;
  const amountTerminal = Number(document.getElementById('j-term')?.value)||0;
  // Clamped: a negative debt would pass every `> 0` filter unseen and silently hide a real debt.
  const debtSom = Math.max(0, Number(document.getElementById('j-debt')?.value)||0);
  const debtor = (document.getElementById('j-debtor')?.value||'').trim();
  const note = document.getElementById('j-note').value.trim();
  if(editing){
    // Refund original items, then deduct new — net effect keeps stock consistent.
    (editing.items||[]).forEach(it => {
      const p = state.products.find(x=>x.id===it.productId);
      if(!p) return;
      const before = p.stock;
      p.stock += (Number(it.qty)||0);
      logStockChange(p.id, p.name, before, p.stock, `install edit (refund ×${it.qty})`);
    });
    items.forEach(it => {
      const p = state.products.find(x=>x.id===it.productId);
      if(!p) return;
      const before = p.stock;
      p.stock = Math.max(0, p.stock - it.qty);
      logStockChange(p.id, p.name, before, p.stock, `install edit (deduct ×${it.qty})`);
    });
    editing.date = date;
    editing.carModel = carModel;
    editing.plate = plate;
    editing.items = items;
    editing.amountUsd = amountUsd;
    editing.amountSom = amountSom;
    editing.amountTransfer = amountTransfer;
    editing.amountClick = amountClick;
    editing.amountTerminal = amountTerminal;
    editing.debtSom = debtSom;
    editing.debtor = debtor;
    editing.note = note;
    // Re-evaluate approval state: only a bank transfer requires the accountant.
    editing.approved = !(amountTransfer > 0);
    if(editing.approved){ delete editing.approvedBy; delete editing.approvedAt; }
  } else {
    const job = {id:uid(), date, carModel, plate, items, amountUsd, amountSom, amountTransfer, amountClick, amountTerminal,
                 debtSom, debtor, note,
                 approved: !(amountTransfer > 0)};
    state.installs.push(job);
    items.forEach(it=>{
      const p = state.products.find(x=>x.id===it.productId);
      if(!p) return;
      const before = p.stock;
      p.stock = Math.max(0, p.stock - it.qty);
      logStockChange(p.id, p.name, before, p.stock, `install ×${it.qty}`);
    });
  }
  editingInstallId = null;
  save(); closeModal();
  // The edit can start from the Debts page too — return the user to where they came from.
  if(currentNav === 'debts') viewDebts(); else viewInstalls();
}
/* =================== WAREHOUSE: ISSUES + RECONCILIATION =================== */
/* The storekeeper writes down what physically left the warehouse; the boss writes what was
   fitted on the car. Both lists are kept separately on purpose — comparing them is the whole
   point. Cars are matched by plate number, which is why two identical Cobalt on one day can
   still be told apart. Stock is moved by the install alone; an issue record never touches it,
   so nothing is deducted twice. */
const plateKey = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const itemMap = items => {
  const m = {};
  (items||[]).forEach(it => {
    const k = it.productId || ('name:'+String(it.name||'').trim().toLowerCase());
    if(!m[k]) m[k] = {key:k, name:it.name||'—', qty:0};
    m[k].qty += Number(it.qty)||0;
  });
  return m;
};
/* One row per car: what was fitted, what was issued, and exactly how they differ. */
function reconRows(range){
  const inR = d => range ? inRange(d, range) : true;
  const rows = [];
  const usedIssues = new Set();
  state.installs.filter(j => inR(j.date)).forEach(j => {
    const pk = plateKey(plateOf(j));
    // Match on the plate; without one, fall back to the same car model on the same day.
    const issue = (state.issues||[]).find(i => !usedIssues.has(i.id) && (
      (pk && plateKey(i.plate) === pk) ||
      (!pk && !plateKey(i.plate) && String(i.carModel||'') === String(j.carModel||'')
           && String(i.date||'').slice(0,10) === String(j.date||'').slice(0,10))));
    if(issue) usedIssues.add(issue.id);
    rows.push({install:j, issue, diffs: issue ? diffItems(j.items, issue.items) : null});
  });
  // Issues nobody fitted: the storekeeper gave parts out for a car that has no install.
  (state.issues||[]).filter(i => inR(i.date) && !usedIssues.has(i.id)).forEach(issue => {
    rows.push({install:null, issue, diffs:null});
  });
  return rows.sort((a,b) => String((b.install||b.issue).date||'').localeCompare(String((a.install||a.issue).date||'')));
}
function diffItems(installItems, issueItems){
  const A = itemMap(installItems), B = itemMap(issueItems);
  const out = [];
  Object.keys(A).forEach(k => {
    if(!B[k]) out.push({kind:'missing', name:A[k].name, installed:A[k].qty, issued:0});
    else if(A[k].qty !== B[k].qty) out.push({kind:'qty', name:A[k].name, installed:A[k].qty, issued:B[k].qty});
  });
  Object.keys(B).forEach(k => { if(!A[k]) out.push({kind:'extra', name:B[k].name, installed:0, issued:B[k].qty}); });
  return out;
}
/* Cars fitted before the storekeeper started using the system have no issue record and never
   will — flagging all of them would bury the real problems. Anything from his first entry
   onwards is fair game. */
const firstIssueDay = () => (state.issues||[]).reduce((m,i) => {
  const d = String(i.date||'').slice(0,10);
  return d && (!m || d < m) ? d : m;
}, null);
function reconStatus(r, since){
  if(!r.install) return 'noInstall';
  if(!r.issue){
    const from = since !== undefined ? since : firstIssueDay();
    return (from && String(r.install.date||'').slice(0,10) >= from) ? 'noIssue' : 'legacy';
  }
  return r.diffs.length ? 'diff' : 'ok';
}
const reconProblemCount = range => {
  const since = firstIssueDay();
  return reconRows(range).filter(r => ['diff','noIssue','noInstall'].includes(reconStatus(r, since))).length;
};

      <div class="kpi"><div class="l">${t('reconNoIssue')}</div><div class="v" style="color:${counts.noIssue?'var(--hi)':'inherit'}">${counts.noIssue}</div></div>

function openRepay(id){

    <h3>${t('repayTitle')}</h3>
    <div style="margin-bottom:10px">

      <div style="color:var(--muted);font-size:12px">${j.date||''}</div>

    </div>

    <select id="r-method" onchange="repayMethodChanged('${id}')">
      <option value="som">${t('cashSom')}</option>
      <option value="usd">USD</option>
      <option value="click">Click</option>
      <option value="terminal">${t('paidTerminal')}</option>
      <option value="transfer">${t('paidTransfer')}</option>
    </select>
    <label style="margin-top:10px">${t('repayAmount')}</label>

    <small id="r-amount-hint" style="color:var(--muted);font-size:11px"></small>
    <div class="modal-actions">

/* The amount field is prefilled with the debt in the unit the chosen method expects.
   Without this, switching the method to USD while the som figure stays in the field
   would book e.g. 1 500 000 "dollars" — a ~12 900× revenue inflation. */
function repayMethodChanged(id){
  const j = state.installs.find(x=>x.id===id); if(!j) return;
  const inp = document.getElementById('r-amount'); if(!inp) return;
  const method = document.getElementById('r-method')?.value || 'som';
  const debt = Number(j.debtSom)||0;
  inp.value = method==='usd' ? Math.round(somToUsd(debt)*100)/100 : debt;
  updateRepayHint();
}
function updateRepayHint(){
  const inp = document.getElementById('r-amount'), hint = document.getElementById('r-amount-hint');
  if(!inp || !hint) return;
  const method = document.getElementById('r-method')?.value || 'som';
  const v = Number(inp.value)||0;
  hint.textContent = !v ? ''
    : method==='usd' ? '$'+fmtNum(v)+' = '+fmtNum(Math.round(usdToSom(v)))+' som'
    : '= '+fmtNum(v)+' som';
}
function saveRepay(id){
  const j = state.installs.find(x=>x.id===id); if(!j) return;
  const method = document.getElementById('r-method')?.value || 'som';
  const amt = Number(document.getElementById('r-amount')?.value)||0;
  if(amt <= 0){ alert(t('invalidAmount')); return; }
  const debt = Number(j.debtSom)||0;
  const somEquiv = method==='usd' ? usdToSom(amt) : amt;
  // Anything past the remaining debt needs an explicit yes before it lands in received
  // money — this is the last line of defence against a som figure saved as USD.
  // Small tolerance so USD rounding on an exact repayment doesn't nag.
  if(somEquiv > debt + Math.max(1000, debt*0.01)){
    if(!confirm(t('repayOvershoot')
        .replace('{paid}', fmtNum(Math.round(somEquiv)))
        .replace('{debt}', fmtNum(debt)))) return;
  }
  // The money lands on the install in the form it actually arrived, so revenue,
  // the payment-method breakdown and the Excel report all pick it up normally.
  if(method==='usd')           j.amountUsd      = (Number(j.amountUsd)||0)      + amt;
  else if(method==='click')    j.amountClick    = (Number(j.amountClick)||0)    + amt;
  else if(method==='terminal') j.amountTerminal = (Number(j.amountTerminal)||0) + amt;
  else if(method==='transfer') j.amountTransfer = (Number(j.amountTransfer)||0) + amt;
  else                         j.amountSom      = (Number(j.amountSom)||0)      + amt;
  j.debtSom = Math.max(0, debt - somEquiv);
  // Dated log: period reports credit the money to the day it actually arrived, and the
  // accountant can see what exactly is new on the install. amt is in the method's unit.
  (j.repayments = j.repayments || []).push({date: today(), method, amt});
  // A repayment by bank transfer needs the accountant's confirmation; Click and terminal
  // do not, same rule as everywhere else.
  if(method==='transfer'){
    j.approved = false; delete j.approvedBy; delete j.approvedAt;
  }
  save(); closeModal(); viewDebts();
}
function delInstall(id){
  if(!confirm(t('confirmDelete'))) return;
  const job = state.installs.find(x=>x.id===id);
  // Deleting an install with an open debt erases a receivable — that needs its own yes.
  if(job && (Number(job.debtSom)||0) > 0 &&
     !confirm(t('confirmDeleteDebt').replace('{sum}', fmtNum(Number(job.debtSom))))) return;
  if(job && job.items){
    job.items.forEach(it=>{
      const p = state.products.find(x=>x.id===it.productId);
      if(!p) return;
      const before = p.stock;
      p.stock += (Number(it.qty)||0);
      logStockChange(p.id, p.name, before, p.stock, `install delete (refund ×${it.qty})`);
    });
  }
  state.installs = state.installs.filter(x=>x.id!==id); save(); viewInstalls();
}

/* =================== APPROVALS (accountant) =================== */
// Cashless som on a sale / install / expense: bank transfer, Click and card terminal.
// Kept apart from cash everywhere, because that money never passes through the till.
const saleCashlessSom = s => (Number(s.paidTransfer)||0) + (Number(s.paidClick)||0) + (Number(s.paidTerminal)||0);
const installCashlessSom = j => (Number(j.amountTransfer)||0) + (Number(j.amountClick)||0) + (Number(j.amountTerminal)||0);
const expenseCashlessSom = e => (Number(e.amountClick)||0) + (Number(e.amountTerminal)||0);
const expenseTotalUsd = e => (Number(e.amountUsd)||0) + somToUsd((Number(e.amountSom)||0) + expenseCashlessSom(e));
const saleAmountUsd = s => (Number(s.paidUsd)||0) + somToUsd((Number(s.paidSom)||0) + saleCashlessSom(s));
const installAmountUsd = j => (Number(j.amountUsd)||0) + somToUsd((Number(j.amountSom)||0) + installCashlessSom(j));
const expenseAmountUsd = e => expenseTotalUsd(e);   // includes Click / terminal
/* Two kinds of закупка, and they are not the same money.
   - Entered on the Закупки page: the app writes a mirror expense carrying purchaseId. The
     boss settles that with the supplier himself, later, so it never leaves the till and is
     NOT a shop expense.
   - Typed by hand into Расходы with type "закупка": that money was handed out of the till
     right then, so it IS an expense and reduces the cash given to the boss.
   Neither is subtracted from ЧИСТАЯ ПРИБЫЛЬ: the same goods are charged as себестоимость
   when the part is fitted, and taking both would charge for them twice. */
const isRecordPurchase = e => e.type === 'purchase' && !!e.purchaseId
  && (state.purchases||[]).some(p => p.id === e.purchaseId);
const isHandPurchase = e => e.type === 'purchase' && !isRecordPurchase(e);
function pendingTotals(){
  let usd = 0;
  let counts = {sales:0, installs:0, expenses:0};
  state.sales.forEach(s => { if(isPending(s)){ counts.sales++; usd += saleAmountUsd(s); } });
  state.installs.forEach(j => { if(isPending(j)){ counts.installs++; usd += installAmountUsd(j); } });
  state.expenses.forEach(e => { if(isPending(e)){ counts.expenses++; usd += expenseAmountUsd(e); } });
  return {usd, counts};
}

  rec.approved = true;
  rec.approvedBy = role;
  rec.approvedAt = nowISO();
  save();
  viewApprovals();
}

/* What the accountant has already confirmed. Only records he actually approved show up —
   they are the ones carrying approvedAt; cash was never his to confirm. */
function approvedHistory(){
  const out = [];
  const push = (rec, kind, what, som, usd, transfer) => out.push({rec, kind, what, som, usd, transfer});
  (state.sales||[]).forEach(s => { if(s.approvedAt) push(s, t('sales'),
      (s.items||[]).map(i=>i.name+' ×'+i.qty).join(', '), s.paidSom, s.paidUsd, s.paidTransfer); });
  (state.installs||[]).forEach(j => { if(j.approvedAt) push(j, t('installs'),
      (j.carModel||'—') + (plateOf(j)?' · '+plateOf(j):''), j.amountSom, j.amountUsd, j.amountTransfer); });
  (state.expenses||[]).forEach(e => { if(e.approvedAt) push(e, t('expenses'),
      [t('expense_'+e.type), e.note].filter(Boolean).join(' · '), e.amountSom, e.amountUsd, 0); });
  return out.sort((a,b) => String(b.rec.approvedAt||'').localeCompare(String(a.rec.approvedAt||'')));
}
function approvedHistoryCard(){
  const list = approvedHistory();
  const rows = list.slice(0, 200).map(x => `<tr>

/* =================== DASHBOARD =================== */
/* Cost of the parts in any items[] list, at the product's current cost price. */
function itemsCOGS(items){
  return (items||[]).reduce((s,it)=>{
    const p = state.products.find(x=>x.id===it.productId);
    return s + (p?.costUsd||0) * (it.qty||0);
  },0);
}
const saleCOGS = sale => itemsCOGS(sale.items);
// Parts fitted during an install job cost money too — count them, or an installation-only
// shop shows zero cost of goods and its whole revenue as profit.
const installCOGS = job => itemsCOGS(job.items);
const periodCOGS = (sales, installs) =>
  (sales||[]).reduce((s,x)=>s+saleCOGS(x),0) + (installs||[]).reduce((s,j)=>s+installCOGS(j),0);
function viewDashboard(){

let archiveRange = {from:'', to:''};
let archiveTouched = false;      // true once the user picks a period themselves
function setArchivePreset(preset){
  archiveTouched = true;
  const now = new Date();
  // Local calendar date. toISOString() would convert to UTC and, at UTC+5, turn
  // "1 August local" into "31 July" — pulling the previous month into the range.
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const today = ymd(now);
  if(preset==='today'){ archiveRange={from:today, to:today};}
  else if(preset==='yesterdayOnly'){ const d=new Date(now); d.setDate(d.getDate()-1);
    const y=ymd(d); archiveRange={from:y, to:y};}
  else if(preset==='7'){ const d=new Date(now); d.setDate(d.getDate()-6); archiveRange={from:ymd(d), to:today};}
  else if(preset==='30'){ const d=new Date(now); d.setDate(d.getDate()-29); archiveRange={from:ymd(d), to:today};}
  else if(preset==='month'){ const d=new Date(now.getFullYear(), now.getMonth(), 1); archiveRange={from:ymd(d), to:today};}
  else if(preset==='all'){ archiveRange={from:'', to:''};}
  viewArchive();
}
function readArchiveInputs(){
  const f = document.getElementById('arc-from')?.value || '';
  const tt = document.getElementById('arc-to')?.value || '';
  archiveRange = {from:f, to:tt};
  renderArchiveBody();
}
function inRange(dateStr, range){
  range = range || archiveRange;
  if(!dateStr) return false;
  const d = dateStr.slice(0,10);
  if(range.from && d < range.from) return false;
  if(range.to && d > range.to) return false;
  return true;
}
/* Debt repayments carry their own date (j.repayments = [{date, method, amt}]), while the
   repaid money is merged into the install's amount fields, which sit under the install's
   own — possibly much older — date. Period views must count a repayment in the period the
   money actually arrived: subtract repayments that left the period (install inside, money
   outside) and add the ones that entered it (install outside, money inside). Otherwise an
   August cash repayment on a June car shows up in no August report, and a re-printed June
   report silently grows. amt is in the method's own unit: USD for 'usd', som otherwise. */
const repaySomOf = r => r.method==='usd' ? usdToSom(r.amt) : (Number(r.amt)||0);
const repayUsdOf = r => r.method==='usd' ? (Number(r.amt)||0) : somToUsd(r.amt);
function repayAdjust(range){
  const adj = {som:0, usd:0, click:0, terminal:0, transfer:0, entries:[]};
  state.installs.forEach(j => {
    const jobIn = inRange(j.date, range);
    (j.repayments||[]).forEach(r => {
      const rIn = inRange(r.date, range);
      if(jobIn !== rIn) adj[r.method==='usd'?'usd':(r.method||'som')] += (rIn ? 1 : -1) * (Number(r.amt)||0);
      if(rIn) adj.entries.push({j, r});
    });
  });
  adj.usdEquiv = adj.usd + somToUsd(adj.som + adj.click + adj.terminal + adj.transfer);
  return adj;
}
function archiveData(range){
  range = range || archiveRange;
  const sales = state.sales.filter(s=>inRange(s.date, range));
  const installs = state.installs.filter(j=>inRange(j.date, range));
  const expenses = state.expenses.filter(e=>inRange(e.date, range));
  const purchases = state.purchases.filter(p=>inRange(p.date, range));
  const repayAdj = repayAdjust(range);
  // Revenue counts every payment method, cash or cashless (transfer / Click).
  const totalRev = sales.reduce((s,x)=>s+x.totalUsd,0)
                 + installs.reduce((s,j)=>s+installAmountUsd(j),0)
                 + repayAdj.usdEquiv;
  // Received per currency in this period (sales + install jobs combined); cashless is som.
  const totalRevUsd = sales.reduce((s,x)=>s+(x.paidUsd||0),0)
                    + installs.reduce((s,j)=>s+(j.amountUsd||0),0)
                    + repayAdj.usd;
  const totalRevSom = sales.reduce((s,x)=>s+(x.paidSom||0)+saleCashlessSom(x),0)
                    + installs.reduce((s,j)=>s+(j.amountSom||0)+installCashlessSom(j),0)
                    + repayAdj.som + repayAdj.click + repayAdj.terminal + repayAdj.transfer;
  const cogs = periodCOGS(sales, installs);
  // opExp = what is SHOWN as расходы: everything paid out except the Закупки-page mirror
  // records (the boss settles those himself). Profit subtracts no закупки at all, because
  // the goods are already charged as себестоимость when fitted.
  const handPurchUsd = expenses.filter(isHandPurchase).reduce((s,e)=>s+expenseTotalUsd(e),0);
  const opExp = expenses.filter(e=>!isRecordPurchase(e)).reduce((s,e)=>s+expenseTotalUsd(e),0)
    + somToUsd(incassoFor(installs));   // per-car collection fee for this period
  // Real cash out per currency in this period
  const opExpUsd = expenses.filter(e=>!isRecordPurchase(e)).reduce((s,e)=>s+(e.amountUsd||0),0);
  const opExpSom = expenses.filter(e=>!isRecordPurchase(e)).reduce((s,e)=>s+(e.amountSom||0),0);
  const profit = totalRev - cogs - (opExp - handPurchUsd);

  const soldMap = {};
  sales.forEach(s=>s.items.forEach(it=>{
    if(!soldMap[it.productId]) soldMap[it.productId] = {name:it.name, qty:0, revenue:0};

/* Minimal self-contained XLSX writer (zip stored + SpreadsheetML), no libraries — works offline. */
const XLSX_CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; }
  return t;
})();
function xlsxCrc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = XLSX_CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}
function xlsxZip(files){
  const enc = new TextEncoder();
  const u16 = v => [v&255,(v>>>8)&255];
  const u32 = v => [v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  const now = new Date();
  const dosTime = (now.getHours()<<11)|(now.getMinutes()<<5)|Math.floor(now.getSeconds()/2);
  const dosDate = ((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  const chunks = [], central = [];
  let offset = 0;
  for(const f of files){
    const nameB = enc.encode(f.name);
    const data = enc.encode(f.xml);
    const crc = xlsxCrc32(data);
    const local = new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(dosTime),...u16(dosDate),...u32(crc),...u32(data.length),...u32(data.length),...u16(nameB.length),...u16(0)]);
    chunks.push(local, nameB, data);
    central.push({nameB, crc, size:data.length, offset});
    offset += local.length + nameB.length + data.length;
  }
  const centralStart = offset;
  for(const c of central){
    const hdr = new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(dosTime),...u16(dosDate),...u32(c.crc),...u32(c.size),...u32(c.size),...u16(c.nameB.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.offset)]);
    chunks.push(hdr, c.nameB);
    offset += hdr.length + c.nameB.length;
  }
  chunks.push(new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(offset-centralStart),...u32(centralStart),...u16(0)]));
  return new Blob(chunks, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
// \n becomes a hard line break inside the cell (needs wrapText on the style to show).
const escXlsx = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/\r/g,'').replace(/\n/g,'&#10;');
function xlsxColRef(n){
  let s=''; n++;
  while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); }
  return s;
}

   A row is {c:[cells], h:height} (h optional). A cell is a primitive, {v,s} or {f,s}

function xlsxSheetXml(rows, widths, opts){

    ? `<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
  const merges = (opts.merges && opts.merges.length)
    ? `<mergeCells count="${opts.merges.length}">${opts.merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '';
  // Element order follows the CT_Worksheet schema sequence — Excel rejects the file otherwise.
  const sheetPr = opts.print ? `<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>` : '';

      + `<pageSetup paperSize="9" orientation="${opts.orientation||'portrait'}" fitToWidth="1" fitToHeight="${opts.fitToHeight!=null?opts.fitToHeight:0}"/>`

    let s = 0, v = cell, f = null;

    // show a number instead of a blank cell.

    }

    const str = (v==null) ? '' : String(v);

  };

  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${sheetPr}${cols}<sheetData>${body}</sheetData>${merges}${printXml}</worksheet>`;

/* The report file is always in Russian, regardless of UI language — boss's request. */
function payMethodLabelRu(usd, som, transfer, click, terminal){
  const parts = [];
  if((Number(usd)||0)>0) parts.push('Наличные USD');
  if((Number(som)||0)>0) parts.push('Наличные сумы');
  if((Number(transfer)||0)>0) parts.push('Перечисление');
  if((Number(click)||0)>0) parts.push('Click');
  if((Number(terminal)||0)>0) parts.push('Терминал');
  return parts.join(' + ') || '—';
}
const nfRu = n => (Math.round((Number(n)||0)*100)/100).toLocaleString('ru-RU');
function moneyTextRu(usd, som, transfer, click, terminal){
  const parts = [];
  if((Number(usd)||0)>0) parts.push('$'+nfRu(usd));
  if((Number(som)||0)>0) parts.push(nfRu(som)+' сум');
  if((Number(transfer)||0)>0) parts.push('перевод '+nfRu(transfer)+' сум');
  if((Number(click)||0)>0) parts.push('Click '+nfRu(click)+' сум');
  if((Number(terminal)||0)>0) parts.push('терминал '+nfRu(terminal)+' сум');
  return parts.join(' + ') || '—';
}
function downloadExcelReport(allTime){
  const range = allTime ? {from:'',to:''} : archiveRange;
  const d = archiveData(range);
  const rangeStr = allTime ? 'Всё время' : ((range.from||'—') + ' — ' + (range.to||'—'));
  const ruExpType = tp => (LOCALES.ru['expense_'+tp] || tp);

  /* Layout, fonts and colours follow the boss's reference workbook. Seven columns A–G.
     XLS names the style indexes defined in buildXlsxBlob's styles.xml. */
  const XLS = {
    title:1, subtitle:2,
    kpiLabel:3, kpiFillGrey:4, kpiLabelBlue:5, kpiFillBlue:6, kpiLabelAmber:7,
    kpiGreen:8, kpiRed:9, kpiNavy:10, kpiPurple:11, kpiAmber:12,
    capGrey:13, capBlue:14, capAmber:15,
    section:16, headNavy:17,
    carB:18, partB:19, costB:20, payoutB:21, cellB:22, revenueB:23,
    mergeMid:24, mergeEnd:25,
    car:26, part:27, cost:28, payout:29, cell:30, payoutUsd:31, revenue:32,
    totalLabel:33, totalFill:34, totalCost:35, totalPayout:36, totalRevenue:37,
    headBlue:38, expCell:39, expMoney:40, expCellB:41, expMoneyB:42, totalExpense:43,
    profit:44, profitB:45, profitTotal:46, dayBand:47,
    incassoPart:48, incassoMoney:49,     // amber, so it never reads as a fitted part
  };
  const S = (v,s)=>({v,s});
  const Fx = (f,s,v)=>({f,s,v});    // v = computed value, cached so blank cells never appear
  // Same per-day car numbers as the app's lists and the payment picker.
  const xlsNoMap = installNoMap();
  const COLS = 7, rows = [], merges = [];
  const at = (r,c) => xlsxColRef(c)+(r+1);
  const put = (cells,h) => { rows.push({c:cells,h}); return rows.length-1; };
  const pad = (cells,style) => { const o = cells.slice(); while(o.length<COLS) o.push(S('',style||0)); return o; };
  const mergeRow = (r,c1,c2) => { if(c2>c1) merges.push(at(r,c1)+':'+at(r,c2)); };
  const mergeCol = (c,r1,r2) => { if(r2>r1) merges.push(at(r1,c)+':'+at(r2,c)); };
  const gap = () => put([]);
  const nameOf = id => { const i = state.installers.find(x=>x.id===id); return i ? i.name : '?'; };
  const costOf = it => (state.products.find(p=>p.id===it.productId)?.costUsd || 0) * (it.qty||0);
  /* Installer pay lives in two places: inline on the job (older records) and as
     'installation_pay' expenses linked by installId (what the app writes today).
     Merge both, per installer, or the report silently loses real money. */
  const jobPayoutList = j => {
    const map = {};
    const bump = (id, usd, som) => {
      if(!id) return;
      if(!map[id]) map[id] = {installerId:id, usd:0, som:0};
      map[id].usd += usd||0; map[id].som += som||0;
    };
    jobInstallers(j).forEach(a => bump(a.installerId, a.paidUsd, a.paidSom));
    (state.expenses||[]).forEach(e => {
      if(e.type === 'installation_pay' && e.installId === j.id) bump(e.installerId, e.amountUsd, e.amountSom);
    });
    return Object.values(map).filter(a => a.usd > 0 || a.som > 0);
  };
  /* Per-install amounts as they stood inside this period: any debt repayment dated outside
     the range is peeled off its method again. So a re-printed closed week still matches the
     copy the boss already settled against the till, and day banners / profit only count
     money that actually arrived in the period. */
  const amountsInPeriod = j => {
    const a = {usd:Number(j.amountUsd)||0, som:Number(j.amountSom)||0,
               transfer:Number(j.amountTransfer)||0, click:Number(j.amountClick)||0,
               terminal:Number(j.amountTerminal)||0};
    (j.repayments||[]).forEach(r => {
      if(!inRange(r.date, range)) a[r.method==='usd'?'usd':(r.method||'som')] -= Number(r.amt)||0;
    });
    Object.keys(a).forEach(k => { a[k] = Math.max(0, a[k]); });
    return a;
  };
  const inPeriodRevenueSom = j => {
    const a = amountsInPeriod(j);
    return usdToSom(a.usd) + a.som + a.transfer + a.click + a.terminal;
  };
  /* Money is credited to the day it actually arrived. A debt repaid today is today's money,
     even when the car was fitted three weeks ago — so a car's own day counts only what came
     in on that day, and every repayment counts on its own date. */
  const ownDayRevenueSom = j => {
    const repaidSom = (j.repayments||[]).reduce((s,r)=>s+repaySomOf(r), 0);
    return Math.max(0, usdToSom(Number(j.amountUsd)||0) + (Number(j.amountSom)||0)
      + (Number(j.amountTransfer)||0) + (Number(j.amountClick)||0) + (Number(j.amountTerminal)||0)
      - repaidSom);
  };
  const repaidOnDaySom = day => state.installs.reduce((s,j) =>
    s + (j.repayments||[]).filter(r => String(r.date||'').slice(0,10) === day)
                          .reduce((t,r)=>t+repaySomOf(r), 0), 0);
  // Repayments received inside the period on cars fitted OUTSIDE it: they have no car row
  // here, so the выручка card has to pick them up separately.
  const outsideRepaySom = state.installs.reduce((s,j) => inRange(j.date, range) ? s
    : s + (j.repayments||[]).filter(r => inRange(r.date, range))
                            .reduce((t,r)=>t+repaySomOf(r), 0), 0);
  // Column A is ~17 characters wide at this font; long note / debt lines soft-wrap, so row
  // height must budget VISUAL lines, not just hard newlines, or the tail gets clipped.
  const visualLines = (txt, w) => String(txt).split('\n')
    .reduce((s,l)=>s+Math.max(1, Math.ceil(l.length/w)), 0);

  /* ---------------- title ---------------- */
  mergeRow(put([S(rangeStr, XLS.title)], 24), 0, COLS-1);
  mergeRow(put([S('ОТЧЁТ GAZMETPROD: РАЗДЕЛЬНАЯ СЕБЕСТОИМОСТЬ, ВЫПЛАТЫ УСТАНОВЩИКАМ И ЧИСТАЯ ПРИБЫЛЬ'
                  + ' · сформирован ' + new Date().toLocaleString('ru-RU')
                  + ' · курс 1$ = ' + nfRu(state.rate||0) + ' сум', XLS.subtitle)], 15), 0, COLS-1);
  gap();

  /* ---------------- KPI cards (formulas patched in once row numbers are known) ---------------- */
  const rKpiLabel = put(pad([
    S('1. ВЫРУЧКА (сум)', XLS.kpiLabel),      S('', XLS.kpiFillGrey),
    S('2. РАСХОДЫ (сум)', XLS.kpiLabel),
    S('3. СДАНО БОССУ — НАЛИЧНЫЕ (сум)', XLS.kpiLabelBlue), S('', XLS.kpiFillBlue),
    S('4. ПОСТАВЩИКАМ (сум)', XLS.kpiLabel),
    S('5. ЧИСТАЯ ПРИБЫЛЬ (сум)', XLS.kpiLabelAmber)]), 14);
  mergeRow(rKpiLabel,0,1); mergeRow(rKpiLabel,3,4);
  const rKpi = put(pad([
    S(0, XLS.kpiGreen), S('', XLS.kpiFillGrey), S(0, XLS.kpiRed),
    S(0, XLS.kpiNavy),  S('', XLS.kpiFillBlue), S(0, XLS.kpiPurple), S(0, XLS.kpiAmber)]), 20);
  mergeRow(rKpi,0,1); mergeRow(rKpi,3,4);

  // Every payment method is summed on its own, so the boss can see exactly how much came
  // in as cash, as Click, on the terminal and by bank transfer. Debt repayments are
  // re-dated via d.repayAdj: money repaid inside the period on an older car is added,
  // money repaid later on an in-period car is taken out — the report matches the till.
  const sumBy = (sKey, jKey) => d.sales.reduce((s,x)=>s+(Number(x[sKey])||0), 0)
                              + d.installs.reduce((s,j)=>s+(Number(j[jKey])||0), 0);
  const rAdj = d.repayAdj || {som:0, usd:0, click:0, terminal:0, transfer:0, entries:[]};
  const gotCash     = sumBy('paidSom',      'amountSom')      + rAdj.som;
  const gotUsd      = sumBy('paidUsd',      'amountUsd')      + rAdj.usd;
  const gotClick    = sumBy('paidClick',    'amountClick')    + rAdj.click;
  const gotTerminal = sumBy('paidTerminal', 'amountTerminal') + rAdj.terminal;
  const gotTransfer = sumBy('paidTransfer', 'amountTransfer') + rAdj.transfer;
  const gotCashless = gotClick + gotTerminal + gotTransfer;
  const rCap = put(pad([
    S('Наличные + Click + терминал + перевод', XLS.capGrey), S('', XLS.kpiFillGrey),
    S('Мастера + прочее + закупки из Расходов + инкасация', XLS.capGrey),
    S('Наличные − расходы наличными · Click, терминал и перевод НЕ входят', XLS.capBlue), S('', XLS.kpiFillBlue),
    S('Себестоимость деталей', XLS.capGrey),
    S('Выручка − себестоимость − расходы (без закупок)', XLS.capAmber)]), 13);
  mergeRow(rCap,0,1); mergeRow(rCap,3,4);

  /* ---- how the money actually arrived, one line per payment method ---- */
  gap();
  mergeRow(put([S('ПОСТУПИЛО ПО ВИДАМ ОПЛАТЫ', XLS.section)]), 0, COLS-1);
  put(pad([S('Вид оплаты',XLS.headBlue), S('Куда попадает',XLS.headBlue), S('',XLS.headBlue),
           S('',XLS.headBlue), S('',XLS.headBlue), S('',XLS.headBlue),
           S('Сумма (сум)',XLS.headBlue)], XLS.headBlue), 22);
  const METHODS = [
    ['Наличные (сум)',            'в кассу → боссу',    gotCash],
    ['Наличные (USD)',            'в кассу → боссу',    usdToSom(gotUsd)],
    ['Click',                     'на счёт',            gotClick],
    ['Терминал',                  'на счёт',            gotTerminal],
    ['Перечисление',              'на счёт',            gotTransfer],
  ].filter(m => m[2] > 0);
  const firstMethodRow = rows.length;
  METHODS.forEach((m, idx) => {
    const b = idx%2===1, cs = b?XLS.expCellB:XLS.expCell, ms = b?XLS.expMoneyB:XLS.expMoney;
    put(pad([S(m[0],cs), S(m[1],cs), S('',cs), S('',cs), S('',cs), S('',cs), S(m[2],ms)], cs), 20);
  });
  let rMethodTotal = null;
  if(METHODS.length){
    rMethodTotal = put(pad([S('ВСЕГО ПОСТУПИЛО:', XLS.totalLabel), S('', XLS.totalFill),
      S('', XLS.totalFill), S('', XLS.totalFill), S('', XLS.totalFill), S('', XLS.totalFill),
      Fx(`SUM(${at(firstMethodRow,6)}:${at(rows.length-1,6)})`, XLS.totalRevenue,
         METHODS.reduce((s,m)=>s+m[2],0))], XLS.totalFill), 22);
    mergeRow(rMethodTotal, 0, 5);
  } else {
    mergeRow(put(pad([S('поступлений нет', XLS.cell)], XLS.cell), 20), 0, COLS-1);
  }

  /* ---------------- 1. installs, one row per fitted part ---------------- */
  gap();
  mergeRow(put([S('1. Раздельный учёт себестоимости деталей, оплаты установщиков и выручки', XLS.section)]), 0, COLS-1);
  const COST_COL = 2, SPEND_COL = 5, PROFIT_COL = 6;
  put(pad([S('Модель авто / заметка',XLS.headNavy), S('Установленный деталь / компонент',XLS.headNavy),
           S('Себестоимость детали · инкасация (сум)',XLS.headNavy), S('Выплаты установщикам (кто / сколько)',XLS.headNavy),
           S('Получено от клиента',XLS.headNavy),
           S('Расходы: детали + мастера + инкасация (сум)',XLS.headNavy), S('ЧИСТАЯ ПРИБЫЛЬ (сум)',XLS.headNavy)],
          XLS.headNavy), 30);

  const jobs = [...d.installs].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  // Group by day so each date gets its own banner and running totals — makes it obvious
  // at a glance which cars were done on which day.
  const byDay = [];
  jobs.forEach(j => {
    const day = (j.date||'').slice(0,10);
    const last = byDay[byDay.length-1];
    if(last && last.day === day) last.jobs.push(j);
    else byDay.push({day, jobs:[j]});
  });
  const firstJobRow = rows.length;
  let totCost = 0, totSpend = 0, totProfit = 0, totPay = 0, totIncasso = 0;
  let jobIdx = 0;
  byDay.forEach(group => {
    // ---- day banner ----
    // What the till actually saw on this date: the day's cars, plus any debt repaid today.
    const dayRepaid = repaidOnDaySom(group.day);
    const dayRevenue = group.jobs.reduce((s,j)=>s+ownDayRevenueSom(j), 0) + dayRepaid;
    const daySpend = group.jobs.reduce((s,j)=>s+usdToSom(installCOGS(j))
      + jobPayoutList(j).reduce((t,a)=>t+usdToSom(a.usd)+a.som, 0), 0)
      + incassoFor(group.jobs);
    const label = group.day
      ? new Date(group.day+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})
      : 'без даты';
    // The whole banner is one text band: keeping numbers out of it means the ИТОГО SUMs
    // below cover only real job rows and can't double-count the day summaries.
    const rDay = put(pad([S(label.toUpperCase() + '   ·   ' + group.jobs.length + ' авто'
      + '   ·   получено ' + nfRu(dayRevenue) + ' сум'
      + (dayRepaid > 0 ? ' (в т.ч. погашено долгов ' + nfRu(dayRepaid) + ')' : '')
      + '   ·   расход ' + nfRu(daySpend) + ' сум'
      + '   ·   прибыль ' + nfRu(dayRevenue-daySpend) + ' сум', XLS.dayBand)], XLS.dayBand), 22);
    mergeRow(rDay, 0, COLS-1);
    group.jobs.forEach(j => renderJob(j, jobIdx++));
  });

  function renderJob(j, idx){
    const b = idx%2===0;                                   // first job banded, like the reference
    const st = b
      ? {car:XLS.carB, part:XLS.partB, cost:XLS.costB, payout:XLS.payoutB, cell:XLS.cellB, rev:XLS.revenueB}
      : {car:XLS.car,  part:XLS.part,  cost:XLS.cost,  payout:XLS.payout,  cell:XLS.cell,  rev:XLS.revenue};
    const parts = (j.items||[]).length ? j.items : [{name:'—', qty:0, productId:null}];
    const payouts = jobPayoutList(j);
    // "Baxromaka — 400 000 сум" per installer, one per line (amounts already summed per person).
    const payoutLines = payouts.map(a=>{
      const m = [];
      if(a.usd>0) m.push('$'+nfRu(a.usd));
      if(a.som>0) m.push(nfRu(a.som)+' сум');
      return nameOf(a.installerId) + ' — ' + (m.join(' + ') || 'не выплачено');
    });
    if(!payoutLines.length) payoutLines.push('установщик не назначен');
    const payoutTxt = payoutLines.join('\n');
    // Everything in this section is reported in som — the currency the shop actually works in.
    const A = amountsInPeriod(j);
    const revenue = inPeriodRevenueSom(j);
    const payment = payouts.reduce((s,a)=>s+usdToSom(a.usd)+a.som, 0);
    const partsSom = usdToSom(installCOGS(j));
    const inc = incassoPerCar();                           // одна инкасация на машину
    const spend = partsSom + payment + inc;                // everything this car cost us
    totCost += partsSom; totSpend += spend; totProfit += revenue-spend; totPay += payment;
    totIncasso += inc;
    const top = rows.length;
    // The note the user typed on the install goes straight under the car model, so it is
    // read on the car's own line instead of being lost.
    const plateTxt = plateOf(j);
    const carCell = jobNoText(installNoOf(j, xlsNoMap)) + (j.carModel||'—')
      + (plateTxt ? '\n' + plateTxt : '')
      + (noteWithoutPlate(j) ? '\n📝 ' + noteWithoutPlate(j) : '')
      + ((Number(j.debtSom)||0) > 0
          ? '\n⚠ Долг: ' + nfRu(j.debtSom) + ' сум' + (j.debtor ? ' — ' + j.debtor : '')
          : '');
    // The payout cell is merged down the whole job; give the first row extra height when the
    // installer list needs more room than the part rows provide (e.g. 3 installers, 1 part).
    const tallest = Math.max(visualLines(payoutTxt, 24), visualLines(carCell, 17));
    // Инкасация rides in the parts column, one amber row under the car's parts — it is a
    // cost of the car, not a payout to an installer, so it must not sit in the payout cell.
    const hasInc = inc > 0;
    const shortfall = Math.max(0, tallest*15 - (parts.length + (hasInc?1:0))*20);
    parts.forEach((it, k) => {
      const last = (k === parts.length-1) && !hasInc;
      const carry = (parts.length>1 || hasInc) ? (last ? XLS.mergeEnd : XLS.mergeMid) : null;
      put(pad(k===0
        ? [S(carCell,st.car), S(it.name+(it.qty>1?' x'+it.qty:''),st.part), S(usdToSom(costOf(it)),st.cost),
           S(payoutTxt,st.payout),
           // A repayment is shown with the date it came in, so the car line explains why the
           // day it was fitted counts less money than the client eventually paid.
           S(moneyTextRu(A.usd,A.som,A.transfer,A.click,A.terminal)
             + (j.repayments||[]).filter(r=>inRange(r.date, range))
                 .map(r=>'\n↩ погашено ' + nfRu(Math.round(repaySomOf(r))) + ' сум · '
                        + String(r.date||'').slice(8,10) + '.' + String(r.date||'').slice(5,7)).join(''),
             st.cell),
           S(spend,st.rev), S(revenue-spend, revenue-spend>=0 ? (b?XLS.profitB:XLS.profit) : XLS.expMoney)]
        : [S('',carry), S(it.name+(it.qty>1?' x'+it.qty:''),st.part), S(usdToSom(costOf(it)),st.cost),
           S('',carry), S('',carry), S('',carry), S('',carry)], 0), k===0 ? 20+shortfall : 20);
    });
    if(hasInc){
      put([S('',XLS.mergeEnd), S('Инкасация',XLS.incassoPart), S(inc,XLS.incassoMoney),
           S('',XLS.mergeEnd), S('',XLS.mergeEnd), S('',XLS.mergeEnd), S('',XLS.mergeEnd)], 20);
    }
    const bottom = rows.length-1;
    [0,3,4,5,6].forEach(c => mergeCol(c, top, bottom));
  }
  const lastJobRow = rows.length-1;

  let rCostTotal = null, rSpendTotal = null, rProfitTotal = null;
  if(jobs.length){
    // SUMs skip the day-banner rows automatically: those columns hold text in A–E and the
    // banner's own F/G day totals would double-count, so each total is summed per column
    // over the data rows only — hence SUMIF-free explicit values as the cached result.
    const sum = (c,v) => Fx(`SUM(${at(firstJobRow,c)}:${at(lastJobRow,c)})`, 0, v);
    rCostTotal = rSpendTotal = rProfitTotal = put(pad([
      S('ИТОГО ПО УСТАНОВКАМ:', XLS.totalLabel), S('', XLS.totalFill),
      {...sum(COST_COL, totCost + totIncasso), s:XLS.totalCost},
      S(totPay, XLS.totalExpense), S('', XLS.totalFill),
      {...sum(SPEND_COL, totSpend), s:XLS.totalExpense},
      {...sum(PROFIT_COL, totProfit), s:XLS.profitTotal}], XLS.totalFill), 22);
    mergeRow(rCostTotal, 0, 1);
  } else {
    mergeRow(put(pad([S('за этот период установок нет', XLS.cell)], XLS.cell), 20), 0, COLS-1);
  }

  /* ---------------- debts: who still owes money ----------------
     Outstanding debts are a TODAY balance, not a period event, so they always come from
     the full state — a monthly report must not hide the debt on an older install (the app's
     Долги page and dashboard KPI count the same way). Repayments received inside the period
     are listed next to them: that is the money already sitting in the method breakdown
     above whose car row may be in an older report. Later section numbers shift by secShift. */
  const debtJobs = state.installs.filter(j => (Number(j.debtSom)||0) > 0)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const periodRepays = [...rAdj.entries]
    .sort((x,y)=>(y.r.date||'').localeCompare(x.r.date||''));
  const secShift = (debtJobs.length || periodRepays.length) ? 1 : 0;
  if(debtJobs.length || periodRepays.length){
    gap();
    mergeRow(put([S('2. Долги клиентов', XLS.section)]), 0, COLS-1);
  }
  if(debtJobs.length){
    put(pad([S('Дата',XLS.headBlue), S('Машина',XLS.headBlue), S('Должник',XLS.headBlue),
             S('Заметка',XLS.headBlue), S('',XLS.headBlue), S('',XLS.headBlue),
             S('Долг (сум)',XLS.headBlue)], XLS.headBlue), 22);
    const firstDebtRow = rows.length;
    debtJobs.forEach((j,idx)=>{
      const b = idx%2===1, cs = b?XLS.expCellB:XLS.expCell, ms = b?XLS.expMoneyB:XLS.expMoney;
      put(pad([S((j.date||'').slice(0,10),cs),
               S(jobNoText(installNoOf(j, xlsNoMap))+(j.carModel||'—')+(plateOf(j)?' '+plateOf(j):''),cs),
               S(j.debtor||'—',cs),
               S(noteWithoutPlate(j),cs), S('',cs), S('',cs), S(Number(j.debtSom),ms)], cs), 20);
    });
    const rDebtTotal = put(pad([S('ВСЕГО ДОЛГОВ НА СЕГОДНЯ (не входит в выручку):', XLS.totalLabel),
      S('',XLS.totalFill), S('',XLS.totalFill), S('',XLS.totalFill), S('',XLS.totalFill),
      S('',XLS.totalFill),
      Fx(`SUM(${at(firstDebtRow,6)}:${at(rows.length-1,6)})`, XLS.totalExpense,
         debtJobs.reduce((s,j)=>s+Number(j.debtSom),0))], XLS.totalFill), 22);
    mergeRow(rDebtTotal, 0, 5);
  }
  if(periodRepays.length){
    if(debtJobs.length) gap();
    put(pad([S('Погашено в этот период',XLS.headBlue), S('Машина',XLS.headBlue), S('Должник',XLS.headBlue),
             S('Вид оплаты',XLS.headBlue), S('',XLS.headBlue), S('',XLS.headBlue),
             S('Сумма (сум)',XLS.headBlue)], XLS.headBlue), 22);
    const firstRepayRow = rows.length;
    const mName = m => m==='som' ? 'Наличные (сум)' : m==='usd' ? 'Наличные (USD)'
      : m==='click' ? 'Click' : m==='terminal' ? 'Терминал' : 'Перечисление';
    periodRepays.forEach(({j, r}, idx)=>{
      const b = idx%2===1, cs = b?XLS.expCellB:XLS.expCell, ms = b?XLS.expMoneyB:XLS.expMoney;
      put(pad([S((r.date||'').slice(0,10),cs), S(jobNoText(installNoOf(j, xlsNoMap))+(j.carModel||'—'),cs),
               S(j.debtor||'—',cs),
               S(mName(r.method) + (r.method==='usd' ? ': $'+nfRu(r.amt) : ''),cs),
               S('',cs), S('',cs), S(Math.round(repaySomOf(r)),ms)], cs), 20);
    });
    const rRepayTotal = put(pad([S('ВСЕГО ПОГАШЕНО ЗА ПЕРИОД (уже входит в поступления выше):', XLS.totalLabel),
      S('',XLS.totalFill), S('',XLS.totalFill), S('',XLS.totalFill), S('',XLS.totalFill),
      S('',XLS.totalFill),
      Fx(`SUM(${at(firstRepayRow,6)}:${at(rows.length-1,6)})`, XLS.totalRevenue,
         periodRepays.reduce((s,e)=>s+Math.round(repaySomOf(e.r)),0))], XLS.totalFill), 22);
    mergeRow(rRepayTotal, 0, 5);
  }

  /* ---------------- 2. every part used, with what it cost in total ---------------- */
  const partTotals = {};
  d.installs.forEach(j => (j.items||[]).forEach(it => {
    const key = it.productId || it.name;
    if(!partTotals[key]) partTotals[key] = {name:it.name, qty:0, som:0};
    partTotals[key].qty += it.qty||0;
    partTotals[key].som += usdToSom(costOf(it));
  }));
  const partList = Object.values(partTotals).sort((a,b)=>b.som-a.som);
  gap();
  mergeRow(put([S((2+secShift)+'. Итого по товарам — что израсходовано со склада', XLS.section)]), 0, COLS-1);
  put(pad([S('Название товара',XLS.headBlue), S('Израсходовано (шт)',XLS.headBlue),
           S('Себестоимость за шт (сум)',XLS.headBlue), S('',XLS.headBlue), S('',XLS.headBlue),
           S('Итого (сум)',XLS.headBlue)], XLS.headBlue), 24);
  const firstPartRow = rows.length;
  partList.forEach((p,idx)=>{
    const b = idx%2===1, cs = b?XLS.expCellB:XLS.expCell, ms = b?XLS.expMoneyB:XLS.expMoney;
    put(pad([S(p.name,cs), S(p.qty,ms), S(p.qty ? Math.round(p.som/p.qty) : 0, ms),
             S('',cs), S('',cs), S(p.som,ms)], cs), 22);
  });
  if(partList.length){
    const rPartTotal = put(pad([S('ВСЕГО ИЗРАСХОДОВАНО ТОВАРА:',XLS.totalLabel), S('',XLS.totalFill),
      S('',XLS.totalFill), S('',XLS.totalFill), S('',XLS.totalFill),
      Fx(`SUM(${at(firstPartRow,5)}:${at(rows.length-1,5)})`, XLS.totalExpense,
         partList.reduce((s,p)=>s+p.som,0))], XLS.totalFill), 22);
    mergeRow(rPartTotal, 0, 4);
  } else {
    mergeRow(put(pad([S('товары не расходовались', XLS.cell)], XLS.cell), 20), 0, COLS-1);
  }

  /* ---------------- 3. daily expenses — installer payouts are a real expense ---------------- */
  // One line per installer for the whole period: name, the cars he worked on, and the
  // overall money he was given — not split across a dozen rows.
  const perInstaller = {};
  d.installs.forEach(j => jobPayoutList(j).forEach(a => {
    if(!perInstaller[a.installerId]) perInstaller[a.installerId] = {som:0, cars:{}, dates:[]};
    const p = perInstaller[a.installerId];
    p.som += usdToSom(a.usd) + a.som;
    const car = j.carModel || 'без модели';
    // Deliberately a count, not the per-day numbers: this line covers the whole period, and
    // "№1, №1" (two different days) reads like a mistake. The wages sheet lists every car
    // with its own date and number for exactly that detail.
    p.cars[car] = (p.cars[car]||0) + 1;
    if(j.date) p.dates.push(j.date.slice(0,10));
  }));
  const payLines = Object.keys(perInstaller).map(id => {
    const p = perInstaller[id];
    const cars = Object.keys(p.cars).map(c => p.cars[c]>1 ? c+' ×'+p.cars[c] : c);
    const jobCount = Object.keys(p.cars).reduce((s,c)=>s+p.cars[c], 0);
    p.dates.sort();
    return {
      date: p.dates.length ? (p.dates[0] === p.dates[p.dates.length-1]
              ? p.dates[0] : p.dates[0]+' — '+p.dates[p.dates.length-1]) : '',
      article: nameOf(id),
      category: cars.join(', '),
      form: nfRu(p.som) + ' сум',
      total: p.som,
      cash: p.som,          // wages are always handed over in cash
    };
  });
  // Those payouts are already listed above; don't repeat them among the general expenses.
  const groupedPayExpenseIds = new Set();
  d.installs.forEach(j => (state.expenses||[]).forEach(e => {
    if(e.type === 'installation_pay' && e.installId === j.id) groupedPayExpenseIds.add(e.id);
  }));
  // "Категория" carries the note the user typed, so the reason for the money is on the row.
  // A payout made without a car carries the reason it was paid instead.
  // A закупка made on the Закупки page is the boss's own settlement with the supplier — it
  // never leaves the till, so it is not listed here and keeps its own section below. A
  // закупка typed by hand into Расходы is money handed out on the spot, so it belongs in
  // this list and comes off the cash given to the boss. Neither is subtracted from profit —
  // see vProfit below.
  const expLines = payLines.concat(d.expenses.filter(e=>!groupedPayExpenseIds.has(e.id) && !isRecordPurchase(e)).map(e=>{
    const reason = isPayReason(e.installId) ? LOCALES.ru['reason_'+e.installId] : '';
    return {
      date: (e.date||'').slice(0,10),
      article: e.type==='installation_pay' && e.installerId ? nameOf(e.installerId) : ruExpType(e.type),
      category: [reason, e.note].filter(Boolean).join(' · ') || '—',
      form: moneyTextRu(e.amountUsd, e.amountSom, 0, e.amountClick, e.amountTerminal),
      total: usdToSom(e.amountUsd||0) + (e.amountSom||0) + expenseCashlessSom(e),
      // Only the part actually paid out of the till reduces the cash handed to the boss:
      // an expense paid by Click or terminal leaves the account, not the drawer.
      cash: usdToSom(e.amountUsd||0) + (e.amountSom||0),
      // Counted in РАСХОДЫ and taken off the boss's cash, but never off the profit.
      isPurchase: isHandPurchase(e),
    };
  })).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const handPurchaseTotal = expLines.filter(e=>e.isPurchase).reduce((s,e)=>s+e.total, 0);
  // One summary line for the whole period, on top: the per-car amounts are already printed
  // on each car's own line in section 1, so repeating them 79 times here would be noise.
  const incassoSom = incassoFor(d.installs);
  if(incassoSom > 0){
    expLines.unshift({
      date: '',
      article: 'Инкасация',
      category: d.installs.length + ' авто × ' + nfRu(incassoPerCar()) + ' сум · платит босс',
      form: 'платит босс',
      total: incassoSom,
      // The boss pays the collection himself, so this money never leaves the till and must
      // not come off "СДАНО БОССУ" — it still counts as a расход and against the profit.
      cash: 0,
    });
  }

  gap();
  mergeRow(put([S((3+secShift)+'. Дневные расходы и выплаты (удерживаются из кассы)', XLS.section)]), 0, COLS-1);
  const EXP_MONEY_COL = 3;
  put(pad([S('Кому / за что',XLS.headBlue), S('Машина / заметка',XLS.headBlue),
           S('Выдано',XLS.headBlue), S('Сумма (сум)',XLS.headBlue),
           S('Дата',XLS.headBlue)], XLS.headBlue), 24);
  const firstExpRow = rows.length;
  expLines.forEach((e,idx)=>{
    const b = idx%2===1, cs = b?XLS.expCellB:XLS.expCell, ms = b?XLS.expMoneyB:XLS.expMoney;
    put(pad([S(e.article,cs), S(e.category,cs), S(e.form,cs), S(e.total,ms), S(e.date,cs)], cs), 22);
  });
  let rExpTotal = null;
  if(expLines.length){
    rExpTotal = put(pad([S('ИТОГО РАСХОДЫ:',XLS.totalLabel), S('',XLS.totalFill), S('',XLS.totalFill),
                     Fx(`SUM(${at(firstExpRow,EXP_MONEY_COL)}:${at(rows.length-1,EXP_MONEY_COL)})`, XLS.totalExpense,
                        expLines.reduce((s,e)=>s+e.total,0))],
                    XLS.totalFill), 22);
    mergeRow(rExpTotal, 0, EXP_MONEY_COL-1);
  } else {
    mergeRow(put(pad([S('за этот период расходов нет', XLS.cell)], XLS.cell), 20), 0, COLS-1);
  }

  /* ---------------- 3. counter sales · 4. purchases (same visual language) ----------------
     Appended only when there is something to show, so a shop that only does installations
     gets exactly the two-section layout of the reference workbook. */
  let extraNo = 3 + secShift;
  const plainBlock = (title, headers, lines, moneyCol) => {
    if(!lines.length) return null;
    gap();
    mergeRow(put([S((++extraNo)+'. '+title, XLS.section)]), 0, COLS-1);
    put(pad(headers.map(h=>S(h,XLS.headBlue)), XLS.headBlue), 24);
    const first = rows.length;
    lines.forEach((cells,idx)=>{
      const b = idx%2===1;
      put(cells.map((v,c)=> c===moneyCol ? S(v, b?XLS.expMoneyB:XLS.expMoney) : S(v, b?XLS.expCellB:XLS.expCell)), 22);
    });
    const blockTotal = lines.reduce((s,cells)=>s+(Number(cells[moneyCol])||0), 0);
    const rTot = put(pad([S('ИТОГО:',XLS.totalLabel)], XLS.totalFill).map((v,c)=>
      c===moneyCol ? Fx(`SUM(${at(first,moneyCol)}:${at(rows.length-1,moneyCol)})`, XLS.totalRevenue, blockTotal) : v), 22);
    mergeRow(rTot, 0, moneyCol-1);
    return rTot;
  };
  const rSalesTotal = plainBlock('Продажи в магазине',
    ['Дата','Проданные товары','Кассир','Форма оплаты','Получено от клиента','','Сумма (сум)'],
    [...d.sales].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>[
      new Date(s.date).toLocaleDateString('ru-RU'),
      (s.items||[]).map(i=>i.name+' ×'+i.qty).join(', '),
      s.cashier||'', payMethodLabelRu(s.paidUsd,s.paidSom,s.paidTransfer,s.paidClick,s.paidTerminal),
      moneyTextRu(s.paidUsd,s.paidSom,s.paidTransfer,s.paidClick,s.paidTerminal), '',
      usdToSom(s.totalUsd||0)]), 6);
  /* Only the покупки made on the Закупки page: money the boss settles with the supplier
     himself, so it is deliberately NOT in "ИТОГО РАСХОДЫ" and NOT deducted from "СДАНО
     БОССУ". Закупки typed by hand into Расходы are real cash out and are listed among the
     expenses above instead, so nothing appears twice. */
  const purchaseRows = d.purchases.map(p => {
    const sup = state.suppliers.find(s=>s.id===p.supplierId);
    return {date:p.date||'', what:(p.items||[]).map(i=>i.name+' ×'+i.qty).join(', ') || (p.note||'—'),
            who: sup?sup.name:'—', som: usdToSom(p.totalUsd||0)};
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  plainBlock('Закупки со страницы «Закупки» — платит босс сам, из кассы не удерживается',
    ['Дата','Что закуплено','Поставщик','','','','Сумма (сум)'],
    purchaseRows.map(p => [p.date, p.what, p.who, '', '', '', p.som]), 6);

  /* ---------------- patch the KPI formulas now that every row number is known ---------------- */
  // Counter sales are money too: their cash already counts towards "СДАНО БОССУ" and sits in
  // the payment-method table, so ВЫРУЧКА and ЧИСТАЯ ПРИБЫЛЬ must include them as well —
  // otherwise the report contradicts itself the first time something is sold over the
  // counter. The parts sold cost money as well, hence the sales-side себестоимость.
  const salesRevenueSom = d.sales.reduce((s,x)=>s+usdToSom(x.totalUsd||0), 0);
  const salesCostSom    = usdToSom(d.sales.reduce((s,x)=>s+saleCOGS(x), 0));
  // "ПОСТАВЩИКАМ" is the cost of the parts alone, so it can only point at the column total
  // while that total is nothing but parts — no инкасация row, no sold-goods cost.
  const costRef = rCostTotal!=null && salesCostSom === 0 && totIncasso === 0
    ? at(rCostTotal,COST_COL) : null;
  // Выручка is no longer its own column — it is расходы + прибыль, which is the same number,
  // plus the shop-sales block when there is one.
  const revRef  = (rSpendTotal!=null && outsideRepaySom === 0)
    ? at(rSpendTotal,SPEND_COL)+'+'+at(rProfitTotal,PROFIT_COL)
      + (rSalesTotal!=null ? '+'+at(rSalesTotal,6) : '') : null;
  const expRef  = rExpTotal!=null  ? at(rExpTotal,EXP_MONEY_COL) : null;
  // Values are computed here as well as referenced by formula, so the cards read correctly
  // even in a viewer that never recalculates.
  // installs + shop sales + debts repaid this period on cars fitted before it (those have no
  // row in section 1, but the money did come in — it is already in the method table above).
  const vRevenue  = totSpend + totProfit + salesRevenueSom + outsideRepaySom;
  const vCost     = totCost + salesCostSom;                   // parts fitted + parts sold
  const vExpenses = expLines.reduce((s,e)=>s+e.total, 0);  // wages + everything else paid out
  // The boss receives CASH only — som and dollars from the till. Money that came in by
  // Click, terminal or bank transfer never passes through his hands, so it is not added;
  // an expense paid by Click or terminal did not leave the till either, so only the cash
  // part of the expenses is taken off; and stock purchases are not touched here at all,
  // because he settles those with the supplier himself, afterwards.
  const vExpensesCash = expLines.reduce((s,e)=>s+(e.cash!=null ? e.cash : e.total), 0);
  const vHanded   = gotCash + usdToSom(gotUsd) - vExpensesCash;
  // Профит: выручка − себестоимость деталей − расходы. Закупки, вписанные в Расходы, из
  // расходов здесь вычитаются обратно: те же товары уже посчитаны как себестоимость, когда
  // деталь встала на машину, и вычесть их дважды — загнать прибыль в минус.
  const vProfit   = vRevenue - vCost - (vExpenses - handPurchaseTotal);
  const kpi = rows[rKpi].c;
  kpi[0] = revRef ? Fx(revRef, XLS.kpiGreen, vRevenue) : S(vRevenue, XLS.kpiGreen);
  kpi[2] = expRef ? Fx(expRef, XLS.kpiRed, vExpenses)  : S(vExpenses, XLS.kpiRed);
  kpi[3] = S(vHanded, XLS.kpiNavy);
  kpi[5] = costRef ? Fx(costRef, XLS.kpiPurple, vCost) : S(vCost, XLS.kpiPurple);
  // Выручка − себестоимость − расходы без закупок (закупки уже сидят в себестоимости)
  kpi[6] = S(vProfit, XLS.kpiAmber);

  const blob = buildXlsxBlob([
    {name:'Финансовый Отчет', rows, widths:[15,22,16,26,30,17,17],
     opts:{print:true, merges, orientation:'landscape', fitToHeight:0}},
  ]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = allTime
    ? `gazmetprod-otchet_ves-period_${new Date().toISOString().slice(0,10)}.xlsx`
    : `gazmetprod-otchet_${range.from||'nachalo'}_${range.to||'segodnya'}.xlsx`;
  a.click();
}

function renderHelpSection(title, items, color){

      <div style="color:var(--muted);font-size:13px;line-height:1.45">${it.body}</div>
    </div>`).join('')}
  </div>`;
}

    <div class="card" style="border-color:#5a2a2e">
      <h3 style="margin-top:0;color:var(--neg)">${t('dangerZone')}</h3>
      <p style="color:var(--muted)">${t('dangerDesc')}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="danger" onclick="wipeData()">${t('wipeAll')}</button>
        ${state._archive
          ? `<button onclick="restoreOldData()">${t('restoreOld')}</button>
             <span style="color:var(--muted);font-size:12px">${t('archivedFrom')}: ${(state._archive.snapshotAt||'').slice(0,16).replace('T',' ')}</span>`
          : `<button disabled style="opacity:.4;cursor:not-allowed">${t('oldData')}</button>`}
      </div>
    </div>`;
  renderRatePreview();
}
function renderRatePreview(){
  const box = document.getElementById('rate-preview'); if(!box) return;
  const typed = Number(document.getElementById('set-rate')?.value) || state.rate;
  if(!typed || typed<=0){ box.innerHTML = ''; return;}
  const totalRev = (state.sales||[]).reduce((s,x)=>s+(x.totalUsd||0),0);
  const cogs = periodCOGS(state.sales, state.installs);
  const totalExp = (state.expenses||[]).reduce((s,e)=>s+(e.amountUsd||0)+((e.amountSom||0)/typed),0);
  const purchExp = (state.expenses||[]).filter(e=>e.type==='purchase').reduce((s,e)=>s+(e.amountUsd||0)+((e.amountSom||0)/typed),0);
  const opExp = totalExp - purchExp;
  const profit = totalRev - cogs - opExp;
  const inv = (state.products||[]).reduce((s,p)=>s+(p.costUsd||0)*(p.stock||0),0);
  const changed = typed !== state.rate;
  const tag = changed
    ? `<span class="chip warn" style="margin-left:8px">${t('previewUnsaved')}</span>`
    : `<span class="chip" style="margin-left:8px;background:var(--panel2);color:var(--muted)">${t('previewCurrent')}</span>`;
  const fmtSomAt = u => Math.round((Number(u)||0) * typed).toLocaleString('en-US') + ' som';
  box.innerHTML = `
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">
      ${t('rateLivePreview')} (1 USD = ${typed.toLocaleString('en-US')} som) ${tag}
    </div>
    <div class="row">
      <div class="kpi"><div class="l">${t('totalRevenue')}</div><div class="v" style="color:var(--pos)">${fmtUsd(totalRev)}</div><div style="color:var(--muted);font-size:13px;margin-top:2px">${fmtSomAt(totalRev)}</div></div>
      <div class="kpi"><div class="l">${t('cogs')}</div><div class="v" style="color:var(--hi)">${fmtUsd(cogs)}</div><div style="color:var(--muted);font-size:13px;margin-top:2px">${fmtSomAt(cogs)}</div></div>
      <div class="kpi"><div class="l">${t('opExpenses')}</div><div class="v" style="color:var(--neg)">${fmtUsd(opExp)}</div><div style="color:var(--muted);font-size:13px;margin-top:2px">${fmtSomAt(opExp)}</div></div>
      <div class="kpi"><div class="l">${t('netProfit')}</div><div class="v" style="color:${profit>=0?'#7ce38b':'#ffb4b4'}">${fmtUsd(profit)}</div><div style="color:var(--muted);font-size:13px;margin-top:2px">${fmtSomAt(profit)}</div></div>
      <div class="kpi"><div class="l">${t('inventoryValue')}</div><div class="v">${fmtUsd(inv)}</div><div style="color:var(--muted);font-size:13px;margin-top:2px">${fmtSomAt(inv)}</div></div>
    </div>`;
}
function saveIncasso(){
  const v = Number(document.getElementById('set-incasso')?.value);
  if(!(v >= 0)){ alert(t('invalidAmount')); return; }
  state.incassoPerCar = Math.round(v);
  save();
  viewSettings();
  alert(t('incassoSaved'));
}
function saveRate(){
  const v = Number(document.getElementById('set-rate').value);
  if(!v || v<=0){ alert(t('invalidAmount')); return;}
  state.rate = v; save(); updateRateLabel();
  // Stay on Settings and confirm in place — jumping to the dashboard made it look
  // as though nothing had been saved.
  viewSettings();
  const box = document.getElementById('rate-preview');
  if(box){
    box.insertAdjacentHTML('afterbegin',
      `<div id="rate-saved" style="margin-bottom:10px;padding:8px 10px;border-radius:6px;
        background:rgba(31,122,58,.12);border:1px solid var(--pos);color:var(--pos);font-weight:600">
        ✓ ${t('rateSaved')}: 1$ = ${fmtNum(v)} som</div>`);
    setTimeout(()=>document.getElementById('rate-saved')?.remove(), 4000);
  }
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `gazmetprod-backup-${today()}.json`;
  a.click();
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!confirm(t('confirmReplace'))) return;
      state = {...structuredClone(DEFAULT_STATE), ...data};
      save(); updateRateLabel(); applyStaticI18n(); renderNav(); viewSettings();
    }catch(err){ alert(t('invalidFile')); }
  };
  r.readAsText(f);
}
function wipeData(){
  if(!confirm(t('confirmWipe'))) return;
  if(!confirm(t('reallyWipe'))) return;
  // Snapshot the transactional data BEFORE wiping so the user can restore via "Old data".
  state._archive = {
    snapshotAt: nowISO(),
    sales: state.sales || [],
    purchases: state.purchases || [],
    installs: state.installs || [],
    expenses: state.expenses || [],
    stockLogs: state.stockLogs || [],
    defectives: state.defectives || [],
    products: (state.products || []).map(p => ({...p})), // includes original stock per product
  };
  // A debt is an outstanding balance, not a period event — wiping it with the period
  // would silently erase real receivables. Carry each one over as a stripped record:
  // no money, parts or payouts (those belong to the wiped period), just the claim.
  // A later repayment gets logged with its own date and lands in the new period's reports.
  const debtCarry = (state.installs || [])
    .filter(j => (Number(j.debtSom)||0) > 0)
    .map(j => ({id:j.id, date:j.date, carModel:j.carModel, note:j.note,
                debtor:j.debtor, debtSom:j.debtSom, repayments:[], items:[],
                amountUsd:0, amountSom:0, amountTransfer:0, amountClick:0, amountTerminal:0,
                approved:true, carriedOver:true}));
  state.sales = [];
  state.purchases = [];
  state.installs = debtCarry;
  state.expenses = [];
  state.stockLogs = [];
  state.defectives = [];
  state.products = (state.products || []).map(p => ({...p, stock: 0}));
  save();
  updateRateLabel();
  alert(t('wipeDone') + (debtCarry.length ? '\n' + t('wipeDebtsKept').replace('{n}', debtCarry.length) : ''));
  viewSettings();
}
function restoreOldData(){
  if(!state._archive){ alert(t('noArchive')); return; }
  if(!confirm(t('confirmRestoreOld'))) return;
  const a = state._archive;
  state.sales      = Array.isArray(a.sales)      ? a.sales      : [];
  state.purchases  = Array.isArray(a.purchases)  ? a.purchases  : [];
  state.installs   = Array.isArray(a.installs)   ? a.installs   : [];
  state.expenses   = Array.isArray(a.expenses)   ? a.expenses   : [];
  state.stockLogs  = Array.isArray(a.stockLogs)  ? a.stockLogs  : [];
  state.defectives = Array.isArray(a.defectives) ? a.defectives : [];
  if(Array.isArray(a.products)) state.products = a.products.map(p => ({...p}));
  delete state._archive;
  save();
  updateRateLabel();
  viewSettings();
}

/* =================== USERS (boss only) =================== */
async function viewUsers(){
  if(!HAS_BACKEND || !authToken){
    V().innerHTML = `<div class="card"><p style="color:var(--muted)">${t('backendOnly')}</p></div>`;
    return;
  }
  V().innerHTML = `<div class="card"><p style="color:var(--muted)">…</p></div>`;
  let users = [];
  try { users = await apiFetch('GET','/api/users'); }
  catch(e){ V().innerHTML = `<div class="card"><p style="color:var(--neg)">${escapeHtml(e.message)}</p></div>`; return; }

  const rows = users.map(u => `
    <tr>
      <td>${escapeHtml(u.username)}</td>
      <td><span class="pill ${u.role==='boss'?'pos':''}">${
        u.role==='boss' ? t('bossRole') : u.role==='accountant' ? t('accountantRole')
        : u.role==='warehouse' ? t('warehouseRole') : t('sellerRole')}</span></td>
      <td style="text-align:right;white-space:nowrap">
        <button onclick="openChangePassword(${u.id}, '${escapeAttr(u.username)}')">${t('changePassword')}</button>
        <button class="danger" onclick="deleteUser(${u.id}, '${escapeAttr(u.username)}')">${t('del')}</button>
      </td>
    </tr>`).join('');

  V().innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="margin:0">${t('users')}</h3>
        <button class="primary" onclick="openAddUser()">${t('addUser')}</button>
      </div>
      <table>
        <thead><tr><th>${t('username')}</th><th>${t('role')}</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="3" class="muted">${t('noData')}</td></tr>`}</tbody>
      </table>
    </div>`;
}

function openAddUser(){
  modal(`
    <h3 style="margin-top:0">${t('addUser')}</h3>
    <label>${t('username')}</label>
    <input id="nu-name" autocomplete="off">
    <label style="margin-top:10px">${t('password')}</label>
    <input id="nu-pass" type="text" autocomplete="off">
    <label style="margin-top:10px">${t('role')}</label>
    <select id="nu-role">
      <option value="seller">${t('sellerRole')}</option>
      <option value="boss">${t('bossRole')}</option>
      <option value="accountant">${t('accountantRole')}</option>
      <option value="warehouse">${t('warehouseRole')}</option>
    </select>
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button onclick="closeModal()">${t('cancel')}</button>
      <button class="primary" onclick="submitAddUser()">${t('save')}</button>
    </div>`);
  setTimeout(()=>document.getElementById('nu-name')?.focus(), 50);
}

async function submitAddUser(){
  const username = document.getElementById('nu-name').value.trim();
  const password = document.getElementById('nu-pass').value;
  const role = document.getElementById('nu-role').value;
  if(!username || !password){ alert(t('required')); return; }
  try {
    await apiFetch('POST','/api/users',{username, password, role});
    closeModal();
    alert(t('userCreated'));
    viewUsers();
  } catch(e){
    if(/exists/i.test(e.message)) alert(t('usernameExists'));
    else alert(e.message);
  }
}

function openChangePassword(id, username){
  modal(`
    <h3 style="margin-top:0">${t('changePassword')}</h3>
    <p style="color:var(--muted);margin-top:0">${escapeHtml(username)}</p>
    <label>${t('newPassword')}</label>
    <input id="cp-pass" type="text" autocomplete="off">
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button onclick="closeModal()">${t('cancel')}</button>
      <button class="primary" onclick="submitChangePassword(${id})">${t('save')}</button>
    </div>`);
  setTimeout(()=>document.getElementById('cp-pass')?.focus(), 50);
}

async function submitChangePassword(id){
  const password = document.getElementById('cp-pass').value;
  if(!password){ alert(t('required')); return; }
  try {
    await apiFetch('PUT',`/api/users/${id}/password`,{password});
    closeModal();
    alert(t('passwordUpdated'));
  } catch(e){ alert(e.message); }
}

async function deleteUser(id, username){
  if(!confirm(t('confirmDeleteUser')+'\n\n'+username)) return;
  try {
    await apiFetch('DELETE',`/api/users/${id}`);
    viewUsers();
  } catch(e){
    if(/last boss/i.test(e.message)) alert(t('cannotDeleteLastBoss'));
    else alert(e.message);
  }
}

/* =================== HELPERS =================== */
function isWithinDays(dateStr, days){
  if(!dateStr) return false;
  const d = new Date(dateStr); const now = new Date();
  return (now - d) <= days*24*60*60*1000 && d <= now;
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));}
function escapeAttr(s){ return escapeHtml(s);}

/* =================== BOOT =================== */
applyTheme();
setLangButtons();
(async function boot(){
  if(HAS_BACKEND){
    if(authToken){
      // Validate token + load state
      try{
        const me = await apiFetch('GET','/api/auth/me');
        if(!me) return;
        role = me.role; sessionStorage.setItem('role', role);
        const s = await apiFetch('GET','/api/state');
        if(s?.data){ state = {...structuredClone(DEFAULT_STATE), ...s.data}; lastKnownUpdatedAt = s.updatedAt || null; }
        applyTheme();
        document.getElementById('login').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        const nav = NAV();
        if(!nav.find(n=>n.id===currentNav)) currentNav = nav[0]?.id || 'pos';
        showApp();
        openEvents();
        maybeRequestNotifications();
        return;
      }catch(e){
        // token invalid - show login
        authToken = null; localStorage.removeItem(TOKEN_KEY);
      }
    }
    applyLoginI18n();
  } else {
    // Standalone
    if(role){
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      const nav = NAV();
      if(!nav.find(n=>n.id===currentNav)) currentNav = nav[0]?.id || 'pos';
      showApp();
    } else {
      applyLoginI18n();
    }
  }
})();
</script>
